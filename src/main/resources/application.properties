spring.application.name=tea-shop-api

# Configuração de Banco com fallback padrão para H2 (desenvolvimento e testes sem dependências)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:teashop}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console